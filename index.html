<script>

function openStory(){
    document.getElementById('content').style.display='block';
    document.getElementById('content').scrollIntoView({
        behavior:'smooth'
    });
}

const noBtn = document.getElementById("noBtn");

noBtn.addEventListener("mouseover",()=>{

    const x = Math.random()*300-150;
    const y = Math.random()*200-100;

    noBtn.style.transform =
    `translate(${x}px,${y}px)`;

});

function acceptDate(){

    document.getElementById("result").innerHTML = `
    <div class="card final">

        <h2>🥰 Yeay!</h2>

        <br>

        <p>
        Aku senang sekali kamu menerima ajakanku ❤️
        <br><br>
        Terima kasih sudah menjadi bagian terindah dalam hidupku.
        <br><br>
        Sekarang tinggal kirim konfirmasi agar aku tahu kamu siap untuk kencan spesial kita.
        </p>

        <br>

        <button onclick="sendWhatsapp()" id="yesBtn">
            💌 Kirim Konfirmasi Ayang
        </button>

    </div>
    `;

    createHearts();

}

function sendWhatsapp(){

    const pesan =
    "Hai Sayangku ❤️%0A%0AAku, Dita, menerima ajakan kencanmu 🥰%0A%0AAku siap untuk hari spesial kita 💕%0A%0ATidak sabar menunggu hari itu 😘";

    window.open(
    "https://wa.me/6285974891363?text=" + pesan,
    "_blank"
    );

}

function createHearts(){

    for(let i=0;i<50;i++){

        const heart = document.createElement("div");

        heart.className = "heart";
        heart.innerHTML = "❤️";

        heart.style.left =
        Math.random()*100 + "vw";

        heart.style.animationDuration =
        (2 + Math.random()*3) + "s";

        document.body.appendChild(heart);

        setTimeout(()=>{
            heart.remove();
        },5000);

    }

}

</script>
